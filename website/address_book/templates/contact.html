{% extends 'base.html' %}

{% block content %}
  
<div class="row mt-3">
  <div class="col-md-5 offset-md-3">
    <form enctype="multipart/form-data" method="POST" class="mb-2">
      {% csrf_token %}
      
      {% include "./includes/form_fields.html" with form=form %}
      <button type="submit" class="btn btn-secondary btn-sm">Save Contact</button>
      {% if contact.id %}
      <a href="{% url 'delete_contact' contact.id %}" class="btn btn-danger btn-sm">Delete</a>
      {% endif %}
      <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm">Back</a>
    </form>
  </div>
</div>
{% endblock %}
