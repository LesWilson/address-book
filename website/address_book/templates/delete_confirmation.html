{% extends 'base.html' %}

{% block content %}
  
<div class="row mt-3">
  <div class="col-md-5 offset-md-3">
    <h1>Delete Confirmation</h1>
    <form method="POST" class="mb-2">
      {% csrf_token %}
      
      <p>Are you sure you want to delete this contact?: {{ name }}</p>

      <button type="submit" class="btn btn-outline-danger btn-sm">Yes, I'm sure</button>
      <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm">No, get me out of here</a>
    </form>
  </div>
</div>
{% endblock %}
