{% load static %}

<style>
  .png-container {
    overflow: hidden;
  }

  .png-container img {
    filter: drop-shadow(0px 1000px 0 white);
    transform: translateY(-1000px);
  }
</style>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark" data-bs-theme="dark">
    <div class="container-fluid">
      <div class="png-container">
      <a class="navbar-brand  png_container" href="{% url 'home' %}">
        <img src="{% static 'images/phone-book-2-1.svg' %}" width="40" height="40"/>
      </a>
      </div>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="{% url 'add_contact' %}">Add Contact</a>
          </li>
        </ul>
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="{% url 'about' %}">About</a>
          </li>
          {% if user.is_authenticated %}
          <li class="nav-item dropdown">
            <a class="nav-link active dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Profile
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
              <li><a class="dropdown-item" href="{% url 'edit_profile' %}">Edit Profile</a></li>
              <li><a class="dropdown-item" href="{% url 'change_password' %}">Change Password</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="{% url 'logout_user' %}">Logout</a></li>
            </ul>
          </li>
          {% else %}
          <li class="nav-item d-flex">
            <a class="nav-link active" href="{% url 'login_user' %}" tabindex="-1" aria-disabled="false">Login</a>
          </li>
          <li class="nav-item d-flex">
            <a class="nav-link active" href="{% url 'register_user' %}" tabindex="-1" aria-disabled="false">Register</a>
          </li>
          {% endif %}
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-secondary" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>
