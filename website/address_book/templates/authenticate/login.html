{% extends 'base.html' %}

{% load static %}

{% block content %}
  <div class="container">
    <div class="row mt-3">
      <div class="col-md-5 offset-md-3">
        <form action="{% url 'login_user' %}" method="POST">
          {% csrf_token %}
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="Username" placeholder="" name="username" value="{{username}}">
            <label for="Username">Username</label>
          </div>
          <div class="form-floating mb-3">
            <input type="password" class="form-control" id="password" placeholder="password" name="password">
            <label for="password">Password</label>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1" name="remember_me">
            <label class="form-check-label" for="exampleCheck1">Remember me</label>
          </div>
          <button type="submit" class="btn btn-secondary">Login</button>
        </form>
      </div>
    </div>
  </div>
  {% endblock %}
