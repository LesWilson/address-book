{% extends 'base.html' %}

{% load static %}

{% block content %}
<style>
    .helptext {
      font-size: 0.7em;
      font-weight: 600;
      color: blue;
    }
    .errorlist {
      color: red;
      font-weight: 700;
      font-size: 0.7em;
      list-style: none;
      padding-left: 0.5rem !important;
    }
  </style>
  
  <div class="container">
    <div class="row mt-3">
      <div class="col-md-5 offset-md-3">
        <form action="{% url 'change_password' %}" method="POST">
          {% csrf_token %}

          {% include "../includes/form_fields.html" with form=form %}

          <button type="submit" class="btn btn-secondary">Change Password</button>
        </form>
      </div>
    </div>
  </div>

{% endblock %}
