{% extends 'base.html' %}

{% load static %}

{% block content %}

    <div class="row mt-3">
      <div class="col-md-5 offset-md-3">

          {% csrf_token %}
          
          {% include "../includes/form_fields.html" with form=form %}

        </form>
      </div>
    </div>
  </div>

  {% endblock %}
